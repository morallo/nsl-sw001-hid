# N-SL SW001 HID-BPF: files under /etc that must survive SteamOS A/B updates.
# Valve only carries over /etc paths listed in /etc/atomic-update.conf.d/.
# Paths are relative to /etc and use the same syntax as the shipped
# example-additional-keep-list.conf (see /etc/atomic-update.conf.d/).
#
# Keeping the udev rule + BPF object here means an early-boot controller
# connect attaches before the ensure service runs; the ensure service
# re-installs them as a safety net regardless.
udev-hid-bpf/nsl-sw001.bpf.o
rules.d/99-hid-bpf-nsl-sw001.rules
systemd/system/steamos-nsl-sw001-bpf.service