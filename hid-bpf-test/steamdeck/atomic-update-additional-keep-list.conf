# N-SL SW001 HID-BPF (Steam Deck): /etc paths that must survive A/B updates.
# Valve only carries over /etc paths listed in /etc/atomic-update.conf.d/.
# Paths are relative to /etc and use the same syntax as the shipped
# example-additional-keep-list.conf (see /etc/atomic-update.conf.d/).
#
# The loader binary, its bundled .so dependencies and the BPF object live
# under /home/.steamos-nsl-sw001-bpf/ and persist unconditionally, so only the
# udev rule and the ensure unit are keep-listed here.
rules.d/99-hid-bpf-nsl-sw001.rules
systemd/system/steamos-nsl-sw001-bpf.service