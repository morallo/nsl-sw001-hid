# N-SL SW001 (added by install-nsl-sw001-deck.sh, marker: nsl-sw001)
# Exclude only the SW001 (057e:2009) from SDL's HIDAPI Nintendo Switch driver
# (which it can't speak), letting SDL fall back to evdev.  Strictly VID/PID:
# also affects genuine Pro Controllers (they lose HIDAPI gyro/rumble).
# Placed in /etc/environment so the vars reach Steam in BOTH Game Mode and
# Desktop Mode (unlike ~/.config/environment.d which Game Mode ignores).
SDL_HIDAPI_IGNORE_DEVICES=0x057e/0x2009
SDL_GAMECONTROLLERCONFIG=0500d71f7e0500000920000001000000,N-SL SW001 Pro Controller,a:b0,b:b1,back:b9,dpdown:b15,dpleft:b16,dpright:b17,dpup:b14,guide:b11,leftshoulder:b5,leftstick:b12,lefttrigger:b7,leftx:a0,lefty:a1,misc1:b4,rightshoulder:b6,rightstick:b13,righttrigger:b8,rightx:a2,righty:a3,start:b10,x:b3,y:b2,platform:Linux,
# end nsl-sw001
