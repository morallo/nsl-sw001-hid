PACKAGE_NAME="nsl-sw001-hid"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="hid-nsl-sw001"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# DKMS runs make inside the staged source dir; the Makefile's M=$(PWD) and
# KDIR=$(shell uname -r)/build do the rest with ${kernelver} pinning headers.
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
