# Make the N-SL SW001 work with SDL / Steam Input on the Steam Deck.
#
# SDL_HIDAPI_IGNORE_DEVICES: exclude only the SW001 (057e:2009) from SDL's
# HIDAPI Nintendo Switch driver (which it can't speak -> "Couldn't load stick
# calibration"), letting SDL fall back to evdev for it.  This value is strictly
# VID/PID based, so it also affects genuine Pro Controllers (they fall back to
# evdev and lose HIDAPI gyro/rumble).  Acceptable for now; revisit if/when a
# genuine controller is used.
#
# SDL_GAMECONTROLLERCONFIG: custom gamecontrollerdb entry mapping the SW001's
# actual axis/button indices to standard SDL gamepad roles.
SDL_HIDAPI_IGNORE_DEVICES=0x057e/0x2009
SDL_GAMECONTROLLERCONFIG=0500d71f7e0500000920000001000000,N-SL SW001 Pro Controller,a:b0,b:b1,back:b9,dpdown:b15,dpleft:b16,dpright:b17,dpup:b14,guide:b11,leftshoulder:b5,leftstick:b12,lefttrigger:b7,leftx:a0,lefty:a1,misc1:b4,rightshoulder:b6,rightstick:b13,righttrigger:b8,rightx:a2,righty:a3,start:b10,x:b3,y:b2,platform:Linux,
