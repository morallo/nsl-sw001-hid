# Keep the in-tree hid-nintendo driver away from the N-SL SW001.
#
# The SW001 identifies as a Pro Controller (057e:2009) at the USB/Bluetooth
# identity level but does NOT implement the Nintendo Pro Controller HID
# protocol that hid-nintendo expects, so hid-nintendo claims it, times out
# (probe fails with -110) and never releases it, blocking hid-nsl-sw001.
#
# NOTE: this disables hid-nintendo GLOBALLY, which also affects genuine
# Nintendo Switch controllers.  This is intentional for now (no genuine
# controllers in use).  If you later use a genuine controller, replace this
# global blacklist with the per-device udev steer rule instead.
blacklist hid_nintendo
